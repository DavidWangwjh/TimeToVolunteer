name: Supabase migrations
run-name: Supabase · ${{ github.event_name == 'push' && 'automatic · development → production' || format('{0} · {1}', inputs.environment, inputs.operation) }}
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
      - '.github/workflows/supabase-migrate-environment.yml'
      - '.github/actions/run-supabase-migration/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Database environment
        type: choice
        options: [development, production]
        default: development
        required: true
      operation:
        description: Plan first; baseline only records the already-applied migrations 001–003
        type: choice
        options: [plan, apply, baseline]
        default: plan
        required: true
permissions:
  contents: read
# Keep automatic rollouts in order; each job also serializes its database writes.
concurrency:
  group: supabase-pipeline-${{ github.event_name == 'push' && 'automatic' || inputs.environment }}
  cancel-in-progress: false
jobs:
  development:
    name: Automatic apply / development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-development
    concurrency:
      group: supabase-development
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENVIRONMENT: development
      OPERATION: apply
      PGCONNECT_TIMEOUT: '15'
      PGSSLMODE: require
      PGOPTIONS: '-c lock_timeout=10000 -c statement_timeout=120000'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-supabase-migration
  production:
    name: Automatic apply / production
    needs: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENVIRONMENT: production
      OPERATION: apply
      PGCONNECT_TIMEOUT: '15'
      PGSSLMODE: require
      PGOPTIONS: '-c lock_timeout=10000 -c statement_timeout=120000'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-supabase-migration
  manual:
    name: Manual ${{ inputs.operation }} / ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-${{ inputs.environment }}
    concurrency:
      group: supabase-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      PGCONNECT_TIMEOUT: '15'
      PGSSLMODE: require
      PGOPTIONS: '-c lock_timeout=10000 -c statement_timeout=120000'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-supabase-migration
