name: Supabase migrations
run-name: Supabase · ${{ github.event_name == 'push' && 'automatic · development → production' || format('{0} · {1}', inputs.environment, inputs.operation) }}
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
      - '.github/workflows/supabase-migrate-environment.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Database environment
        type: choice
        options: [development, production]
        default: development
        required: true
      operation:
        description: Plan first; baseline only records the already-applied migrations 001–003
        type: choice
        options: [plan, apply, baseline]
        default: plan
        required: true
permissions:
  contents: read
# Keep automatic development → production runs in order. The reusable job also
# serializes by database, including manual runs, to prevent simultaneous writes.
concurrency:
  group: supabase-pipeline-${{ github.event_name == 'push' && 'automatic' || inputs.environment }}
  cancel-in-progress: false
jobs:
  development:
    name: Automatic apply / development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/supabase-migrate-environment.yml
    with:
      environment: development
      operation: apply
  production:
    name: Automatic apply / production
    needs: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/supabase-migrate-environment.yml
    with:
      environment: production
      operation: apply
  manual:
    name: Manual ${{ inputs.operation }} / ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/supabase-migrate-environment.yml
    with:
      environment: ${{ inputs.environment }}
      operation: ${{ inputs.operation }}
